<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warum hält der Mensch Tiere?</title>
<style>
:root{--navy:#102c56;--green:#2f9e44;--green-dark:#237a34;--sky:#e6f4ff;--yellow:#ffd43b;--paper:#fff;--line:#cfe3f3;--muted:#53657d;--red:#c83d45}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font-family:"Avenir Next","Trebuchet MS",Arial,sans-serif}button,select{font:inherit}button{touch-action:manipulation}.app{min-height:100vh;max-width:1160px;margin:auto;padding:28px 24px 44px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:36px}.brand{display:flex;align-items:center;gap:14px;font-size:clamp(25px,4vw,40px);font-weight:900;line-height:1.08}.tractor{font-size:48px}.voice-box{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:16px;font-weight:800}.voice-box select{max-width:210px;min-height:48px;border:2px solid var(--line);border-radius:14px;padding:8px 34px 8px 12px;background:white;color:var(--navy)}.screen{display:none}.screen.active{display:block}.listen-row{display:flex;align-items:flex-start;gap:14px}.speak{flex:0 0 52px;width:52px;height:52px;border:0;border-radius:50%;background:#cceaff;color:var(--navy);display:inline-grid;place-items:center;cursor:pointer;font-size:25px;box-shadow:0 0 0 2px #a8d6f6 inset}.speak:hover{background:#b6e0ff}.speak.speaking{background:var(--red);color:white;box-shadow:none}.speak:focus-visible,.choice:focus-visible,.primary:focus-visible,.back:focus-visible,select:focus-visible{outline:5px solid var(--yellow);outline-offset:4px}.intro{max-width:720px;margin:0 auto 34px;text-align:center}.intro .listen-row{justify-content:center;align-items:center}h1{font-size:clamp(38px,6vw,66px);line-height:1.04;margin:0;font-weight:900;letter-spacing:-1.5px}.instruction{font-size:clamp(23px,3vw,32px);font-weight:800;margin:22px 0 0}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.choice{border:3px solid var(--line);border-radius:28px;background:white;padding:12px 12px 18px;cursor:pointer;color:var(--navy);min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:transform .18s,border-color .18s}.choice:hover{transform:translateY(-4px);border-color:#85c2ee}.choice .photo{width:100%;height:170px;border-radius:20px;object-fit:cover;margin-bottom:14px}.choice .choice-bottom{display:flex;align-items:center;gap:10px;font-size:27px;font-weight:900}.choice .speak{width:48px;height:48px;flex-basis:48px;font-size:22px}.lesson-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;margin-bottom:24px}.back,.primary{border:0;border-radius:18px;min-height:54px;padding:12px 22px;background:var(--green);color:white;font-weight:900;font-size:20px;cursor:pointer}.back:hover,.primary:hover{background:var(--green-dark)}.progress{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:900;font-size:18px}.dots{display:flex;gap:8px}.dot{width:18px;height:18px;border-radius:50%;background:#c7deef}.dot.on{background:var(--yellow);box-shadow:0 0 0 2px #e0ae00 inset}.lesson-title{justify-content:center;align-items:center;text-align:center;margin:6px auto 22px}.lesson-title h2{font-size:clamp(35px,5vw,54px);margin:0;line-height:1.05}.lesson-card{max-width:820px;margin:auto}.lesson-card img{display:block;width:100%;height:min(48vw,430px);min-height:280px;object-fit:cover;border-radius:28px;border:3px solid var(--line)}.fact{align-items:center;justify-content:center;margin:24px auto;max-width:780px}.fact-text{text-align:left}.fact h3{font-size:clamp(25px,3.4vw,36px);margin:0 0 5px;line-height:1.15}.fact p{font-size:clamp(20px,2.5vw,27px);line-height:1.35;margin:0;color:var(--muted);font-weight:650}.lesson-actions{display:flex;justify-content:center;gap:14px;margin-top:28px}.primary{font-size:23px;min-width:180px}.primary.secondary{background:var(--sky);color:var(--navy);border:2px solid var(--line)}.done{padding:44px 20px;background:var(--sky);border-radius:30px;text-align:center}.done .big{font-size:76px;margin-bottom:12px}.done h2{font-size:clamp(34px,5vw,52px);margin:0}.done p{font-size:24px;color:var(--muted);font-weight:700}.notice{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:12px 18px;border-radius:14px;background:var(--navy);color:white;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.notice.show{opacity:1}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:850px){.choices{grid-template-columns:repeat(2,1fr)}.lesson-head{grid-template-columns:auto 1fr}.progress{grid-column:1/-1;justify-content:center;grid-row:2}.topbar{align-items:flex-start}.brand{max-width:560px}}
@media(max-width:560px){.app{padding:16px 14px 32px}.topbar{display:block;margin-bottom:28px}.tractor{font-size:38px}.voice-box{margin-top:18px}.voice-box select{flex:1;max-width:none}.choices{grid-template-columns:1fr;gap:14px}.choice{min-height:150px;display:grid;grid-template-columns:150px 1fr;padding:10px}.choice .photo{height:130px;margin:0}.choice .choice-bottom{justify-content:center;font-size:24px}.lesson-head{gap:10px}.back{font-size:18px;padding:10px 15px}.lesson-card img{height:300px;min-height:0}.fact{align-items:flex-start}.speak{width:48px;height:48px;flex-basis:48px}.lesson-actions{flex-direction:column}.primary{width:100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
.choice{cursor:default}.choice-open{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer}.animal-name{border:0;background:none;color:var(--navy);font-weight:900;font-size:27px;padding:8px;cursor:pointer}.speak svg{width:27px;height:27px;display:block}
</style>
</head>
<body>
<main class="app">
  <header class="topbar"><div class="brand"><span class="tractor" aria-hidden="true">🚜</span><span>Warum hält der Mensch Tiere?</span></div></header>
  <section id="home" class="screen active">
    <div class="intro"><div class="listen-row"><button class="speak" data-audio="heading" aria-label="Überschrift vorlesen">🔊</button><h1>Warum hält der Mensch Tiere?</h1></div><div class="listen-row"><button class="speak" data-audio="instruction" aria-label="Aufgabe vorlesen">🔊</button><p class="instruction">Wähle ein Tier aus.</p></div></div>
    <div class="choices" id="choices"></div>
  </section>
  <section id="lesson" class="screen" aria-live="polite"><div class="lesson-head"><button class="back" id="backBtn">← Zurück</button><div></div><div class="progress"><span id="progressText"></span><span class="dots" id="dots" aria-hidden="true"></span></div></div><div id="lessonContent"></div></section>
  <div class="notice" id="notice" role="status" aria-live="polite"></div>
</main>
<script>
const animals={
  kuh:{name:"Kuh",cover:"assets/kuh_weide.png",steps:[
    {img:"assets/kuh_weide.png",title:"Kühe leben auf dem Bauernhof.",text:"Manche Kühe stehen auf der Weide."},{img:"assets/kuh_stall.png",title:"Kühe brauchen einen guten Platz.",text:"Viele Kühe leben auch in einem Stall."},{img:"assets/kuh_melken.png",title:"Kühe geben Milch.",text:"Die Milch wird beim Melken gesammelt."},{img:"assets/milchtanker.png",title:"Die Milch wird abgeholt.",text:"Ein Tankwagen bringt sie zur Molkerei."},{img:"assets/milchprodukte.png",title:"Aus Milch wird vieles gemacht.",text:"Zum Beispiel Käse, Butter und Joghurt."},{img:"assets/rind_verkauf.png",title:"Rinder geben uns auch Fleisch.",text:"Das Fleisch wird als Lebensmittel verkauft."}
  ]},
  schwein:{name:"Schwein",cover:"assets/schwein_auslauf.png",steps:[
    {img:"assets/schwein_auslauf.png",title:"Schweine leben auf dem Bauernhof.",text:"Manche Schweine können nach draußen gehen."},{img:"assets/schwein_stall.png",title:"Viele Schweine leben im Stall.",text:"Dort brauchen sie Futter, Wasser und Platz."},{img:"assets/schwein_fuetterung.png",title:"Schweine werden gefüttert.",text:"Die Menschen auf dem Hof versorgen sie."},{img:"assets/schwein_verkauf.png",title:"Schweine geben uns Fleisch.",text:"Daraus werden verschiedene Lebensmittel gemacht."}
  ]},
  huhn:{name:"Huhn",cover:"assets/huhn_freiland.png",steps:[
    {img:"assets/huhn_freiland.png",title:"Hühner leben auf dem Bauernhof.",text:"Manche Hühner können nach draußen gehen."},{img:"assets/ei_nest.png",title:"Hennen legen Eier.",text:"Sie legen die Eier in ein Nest."},{img:"assets/ei_sammeln_hand.png",title:"Die Eier werden gesammelt.",text:"Das geht mit der Hand oder mit einer Maschine."},{img:"assets/ei_verpacken.png",title:"Die Eier werden verpackt.",text:"Danach können wir sie im Laden kaufen."},{img:"assets/huhn_mast_verkauf.png",title:"Hühner geben uns auch Fleisch.",text:"Auch Hühnerfleisch wird als Lebensmittel verkauft."}
  ]},
  hund:{name:"Hund",cover:"assets/hund_kinder.png",steps:[
    {img:"assets/hund_kinder.png",title:"Ein Hund kann zur Familie gehören.",text:"Er spielt mit den Menschen und begleitet sie."},{img:"assets/hund_hof.png",title:"Ein Hund kann auf den Hof aufpassen.",text:"Er hört und sieht oft sehr gut."},{img:"assets/hund_hueten.png",title:"Manche Hunde helfen bei der Arbeit.",text:"Sie können zum Beispiel Schafe hüten."},{img:"assets/hund_haus.png",title:"Der Hund ist meist ein Haustier.",text:"Er gibt uns keine Lebensmittel."}
  ]}
};
const home=document.getElementById("home"),lesson=document.getElementById("lesson"),choices=document.getElementById("choices"),lessonContent=document.getElementById("lessonContent"),progressText=document.getElementById("progressText"),dots=document.getElementById("dots"),notice=document.getElementById("notice");
let currentAnimal=null,currentStep=0,currentButton=null,currentAudio=null;
const speakerSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a4.5 4.5 0 0 0-2-3.74v7.48A4.5 4.5 0 0 0 15.5 12zm-2-7.95v2.08a7 7 0 0 1 0 11.74v2.08a9 9 0 0 0 0-15.9z"/></svg>';
document.querySelectorAll('.speak').forEach(button=>button.innerHTML=speakerSvg);
function speaker(audio,label){return `<button class="speak" data-audio="${audio}" aria-label="${label}">${speakerSvg}</button>`}
Object.entries(animals).forEach(([key,animal])=>{const card=document.createElement("div");card.className="choice";card.innerHTML=`<button class="choice-open" data-animal="${key}" aria-label="${animal.name} öffnen"><img class="photo" src="${animal.cover}" alt="${animal.name} auf dem Bauernhof"></button><span class="choice-bottom">${speaker('animal-'+key,animal.name+' vorlesen')}<button class="animal-name" data-animal="${key}">${animal.name}</button></span>`;card.querySelectorAll('[data-animal]').forEach(button=>button.addEventListener("click",()=>openAnimal(key)));choices.appendChild(card)});
function stopSpeech(){if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null}if(currentButton){currentButton.classList.remove("speaking");currentButton.innerHTML=speakerSvg;currentButton.setAttribute("aria-pressed","false");currentButton=null}}
function speak(audioName,button){if(currentButton===button){stopSpeech();return}stopSpeech();const audio=new Audio(`assets/audio-api/${audioName}.mp3`);currentAudio=audio;currentButton=button;button.classList.add("speaking");button.textContent="■";button.setAttribute("aria-pressed","true");const finish=()=>{if(currentAudio===audio)stopSpeech()};audio.addEventListener("ended",finish);audio.addEventListener("error",()=>{finish();showNotice("Die Tondatei konnte nicht abgespielt werden.")});audio.play().catch(()=>{finish();showNotice("Bitte tippe noch einmal auf den Lautsprecher.")})}
document.addEventListener("click",event=>{const button=event.target.closest("[data-audio]");if(!button)return;event.preventDefault();event.stopPropagation();speak(button.dataset.audio,button)});
function openAnimal(key){currentAnimal=key;currentStep=0;home.classList.remove("active");lesson.classList.add("active");renderLesson();window.scrollTo(0,0)}
function showHome(){stopSpeech();lesson.classList.remove("active");home.classList.add("active");currentAnimal=null;window.scrollTo(0,0)}
function renderLesson(){stopSpeech();const animal=animals[currentAnimal],total=animal.steps.length;if(currentStep>=total){renderDone(animal);return}const step=animal.steps[currentStep];progressText.textContent=`${currentStep+1} von ${total}`;dots.innerHTML=animal.steps.map((_,i)=>`<span class="dot ${i===currentStep?'on':''}"></span>`).join("");lessonContent.innerHTML=`<div class="listen-row lesson-title">${speaker('animal-'+currentAnimal,animal.name+' vorlesen')}<h2>${animal.name}</h2></div><div class="lesson-card"><img src="${step.img}" alt="${step.title}"><div class="listen-row fact">${speaker(currentAnimal+'-'+(currentStep+1),'Text vorlesen')}<div class="fact-text"><h3>${step.title}</h3><p>${step.text}</p></div></div><div class="lesson-actions">${currentStep>0?'<button class="primary secondary" id="prevBtn">← Zurück</button>':''}<button class="primary" id="nextBtn">${currentStep===total-1?'Fertig':'Weiter →'}</button></div></div>`;document.getElementById("nextBtn").addEventListener("click",()=>{currentStep++;renderLesson();window.scrollTo(0,0)});const prev=document.getElementById("prevBtn");if(prev)prev.addEventListener("click",()=>{currentStep--;renderLesson();window.scrollTo(0,0)})}
function renderDone(animal){progressText.textContent="Geschafft!";dots.innerHTML="";lessonContent.innerHTML=`<div class="done"><div class="big" aria-hidden="true">⭐</div><div class="listen-row lesson-title">${speaker('done-'+currentAnimal,'Lob vorlesen')}<div><h2>Gut gemacht!</h2><p>Du kennst dich jetzt mit dem ${animal.name} aus.</p></div></div><div class="lesson-actions"><button class="primary" id="anotherBtn">Anderes Tier wählen</button></div></div>`;document.getElementById("anotherBtn").addEventListener("click",showHome)}
function showNotice(text){notice.textContent=text;notice.classList.add("show");setTimeout(()=>notice.classList.remove("show"),2500)}
document.getElementById("backBtn").addEventListener("click",showHome);document.addEventListener("keydown",event=>{if(event.key==="Escape")stopSpeech()});
</script>
</body>
</html>
